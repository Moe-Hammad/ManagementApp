<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <style>
    .box { fill: #ffffff; stroke: #2b2b2b; stroke-width: 2; }
    .title { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #111; }
    .stereo { font: 12px "Segoe UI", Arial, sans-serif; fill: #555; }
    .label { font: 12px "Segoe UI", Arial, sans-serif; fill: #222; }
    .mult { font: 12px "Segoe UI", Arial, sans-serif; fill: #222; }
    .line { stroke: #2b2b2b; stroke-width: 2; fill: none; }
    .dashed { stroke-dasharray: 6 4; }
  </style>

  <defs>
    <marker id="inheritance" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff" stroke="#2b2b2b" stroke-width="1.5"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <!-- Classes -->
  <g>
    <rect class="box" x="600" y="40" width="200" height="60" rx="6"/>
    <text class="title" x="700" y="70" text-anchor="middle">User</text>
    <text class="stereo" x="700" y="90" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
  </g>

  <g>
    <rect class="box" x="120" y="160" width="200" height="60" rx="6"/>
    <text class="title" x="220" y="195" text-anchor="middle">Manager</text>
  </g>

  <g>
    <rect class="box" x="980" y="160" width="200" height="60" rx="6"/>
    <text class="title" x="1080" y="195" text-anchor="middle">Employee</text>
  </g>

  <g>
    <rect class="box" x="600" y="260" width="200" height="60" rx="6"/>
    <text class="title" x="700" y="295" text-anchor="middle">Request</text>
  </g>

  <g>
    <rect class="box" x="120" y="360" width="200" height="60" rx="6"/>
    <text class="title" x="220" y="395" text-anchor="middle">Task</text>
  </g>

  <g>
    <rect class="box" x="980" y="360" width="200" height="60" rx="6"/>
    <text class="title" x="1080" y="395" text-anchor="middle">CalendarEntry</text>
  </g>

  <g>
    <rect class="box" x="600" y="460" width="200" height="60" rx="6"/>
    <text class="title" x="700" y="495" text-anchor="middle">TaskAssignment</text>
  </g>

  <g>
    <rect class="box" x="120" y="560" width="200" height="60" rx="6"/>
    <text class="title" x="220" y="595" text-anchor="middle">Chat</text>
  </g>

  <g>
    <rect class="box" x="600" y="560" width="200" height="60" rx="6"/>
    <text class="title" x="700" y="595" text-anchor="middle">LeaveRequest</text>
  </g>

  <g>
    <rect class="box" x="120" y="640" width="200" height="60" rx="6"/>
    <text class="title" x="220" y="675" text-anchor="middle">Message</text>
  </g>

  <g>
    <rect class="box" x="600" y="640" width="200" height="60" rx="6"/>
    <text class="title" x="700" y="675" text-anchor="middle">RefreshToken</text>
  </g>

  <!-- Inheritance -->
  <line class="line" x1="220" y1="160" x2="700" y2="100" marker-end="url(#inheritance)"/>
  <line class="line" x1="1080" y1="160" x2="700" y2="100" marker-end="url(#inheritance)"/>

  <!-- Manager <-> Employee -->
  <line class="line" x1="320" y1="190" x2="980" y2="190"/>
  <text class="mult" x="330" y="176">1</text>
  <text class="mult" x="940" y="176">0..*</text>

  <!-- Manager -> Task -->
  <line class="line" x1="220" y1="220" x2="220" y2="360"/>
  <text class="mult" x="205" y="236">1</text>
  <text class="mult" x="205" y="356">0..*</text>

  <!-- Manager -> Request -->
  <line class="line" x1="320" y1="190" x2="600" y2="290"/>
  <text class="mult" x="330" y="204">1</text>
  <text class="mult" x="585" y="286">0..*</text>

  <!-- Employee -> Request -->
  <line class="line" x1="980" y1="190" x2="800" y2="290"/>
  <text class="mult" x="952" y="204">1</text>
  <text class="mult" x="812" y="286">0..*</text>

  <!-- Task -> TaskAssignment -->
  <line class="line" x1="320" y1="390" x2="600" y2="490"/>
  <text class="mult" x="330" y="374">1</text>
  <text class="mult" x="585" y="486">0..*</text>

  <!-- Employee -> TaskAssignment (routed) -->
  <polyline class="line" points="1180,190 1180,490 800,490"/>
  <text class="mult" x="1160" y="204">1</text>
  <text class="mult" x="812" y="486">0..*</text>

  <!-- Employee -> CalendarEntry -->
  <line class="line" x1="1080" y1="220" x2="1080" y2="360"/>
  <text class="mult" x="1065" y="236">1</text>
  <text class="mult" x="1065" y="356">0..*</text>

  <!-- CalendarEntry -> Task (optional) -->
  <line class="line dashed" x1="980" y1="390" x2="320" y2="390" marker-end="url(#arrow)"/>
  <text class="label" x="640" y="376">forTask</text>
  <text class="mult" x="330" y="376">0..*</text>
  <text class="mult" x="950" y="376">0..1</text>

  <!-- Chat -> Task (optional) -->
  <line class="line dashed" x1="220" y1="560" x2="220" y2="420" marker-end="url(#arrow)"/>
  <text class="label" x="236" y="500">task</text>
  <text class="mult" x="205" y="434">0..1</text>
  <text class="mult" x="205" y="556">0..1</text>

  <!-- Chat -> Message -->
  <line class="line" x1="220" y1="620" x2="220" y2="640"/>
  <text class="mult" x="205" y="632">1</text>
  <text class="mult" x="205" y="658">0..*</text>

  <!-- LeaveRequest -> Manager/Employee -->
  <line class="line" x1="600" y1="590" x2="320" y2="190"/>
  <text class="label" x="420" y="420">decidedBy</text>
  <text class="mult" x="332" y="204">0..1</text>
  <text class="mult" x="585" y="604">0..*</text>

  <polyline class="line" points="1180,190 1180,590 800,590"/>
  <text class="mult" x="1160" y="204">1</text>
  <text class="mult" x="812" y="604">0..*</text>

  <!-- User -> RefreshToken (routed) -->
  <polyline class="line" points="800,70 1140,70 1140,670 800,670"/>
  <text class="label" x="1120" y="380">tokens</text>
  <text class="mult" x="810" y="86">1</text>
  <text class="mult" x="812" y="686">0..*</text>
</svg>
